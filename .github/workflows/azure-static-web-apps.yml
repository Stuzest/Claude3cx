# Everon Call Dashboard — deploy workflow v1.1.0
# Tests the API, then deploys frontend/ + api/ to Azure Static Web Apps on every
# push to main. Needs repo secret AZURE_STATIC_WEB_APPS_API_TOKEN (the SWA
# deployment token). All runtime secrets live in the SWA app settings, not here.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test API
        working-directory: api
        run: npm ci && npm test
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          api_location: api
          output_location: ""
